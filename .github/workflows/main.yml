name: Repository Backup and Release

on:
  workflow_dispatch:
    inputs:
      repo_filter:
        description: '只备份 URL 中包含该子串的仓库（留空 = 全部）'
        required: false
        default: ''
      limit:
        description: '最多处理前 N 个仓库（0 = 全部）'
        required: false
        default: '0'
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: write

concurrency:
  group: repository-backup
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TZ: UTC
  SHARD_TOTAL: '6'

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.create_release.outputs.tag }}
      start_epoch: ${{ steps.meta.outputs.start_epoch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows/
            scripts/
            back_ck_url.txt
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Meta
        id: meta
        run: echo "start_epoch=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: Prune stale drafts
        run: bash scripts/prune.sh --drafts
        env:
          DRAFT_KEEP_DAYS: '3'

      - name: Build size-balanced shard map
        run: SHARD_TOTAL="$SHARD_TOTAL" bash scripts/shardmap.sh back_ck_url.txt

      - name: Upload shard map
        uses: actions/upload-artifact@v4
        with:
          name: shardmap
          path: shardmap.tsv
          retention-days: 7

      - name: Create draft release
        id: create_release
        run: |
          set -euo pipefail
          tag="backup-$(date -u +%Y%m%d%H%M%S)"
          gh release create "$tag" \
            --title "📦 Backups $(date -u +'%Y-%m-%d %H:%M UTC')" \
            --notes "🚧 备份进行中…" \
            --draft
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  backup:
    name: Backup (shard ${{ matrix.shard }}/6)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_MAP: shardmap.tsv
      MANIFEST_FILE: manifest-shard-${{ matrix.shard }}.tsv
      FAILED_FILE: failed-shard-${{ matrix.shard }}.tsv
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows/
            scripts/
            back_ck_url.txt
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Download shard map
        uses: actions/download-artifact@v4
        with:
          name: shardmap

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.2
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Setup
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd pv jq
          {
            echo "WORKSPACE=$GITHUB_WORKSPACE"
            echo "START_EPOCH=$(date -u +%s)"
          } >> "$GITHUB_ENV"

      - name: Backup repositories
        run: bash scripts/backup.sh
        env:
          LIMIT: ${{ inputs.limit }}
          REPO_FILTER: ${{ inputs.repo_filter }}

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: |
            manifest-shard-${{ matrix.shard }}.tsv
            failed-shard-${{ matrix.shard }}.tsv
          if-no-files-found: ignore
          retention-days: 7

  finalize:
    name: Finalize
    needs: [prepare, backup]
    if: always() && needs.prepare.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      START_EPOCH: ${{ needs.prepare.outputs.start_epoch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows/
            scripts/
            back_ck_url.txt
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Download shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          merge-multiple: true

      - name: Merge shard manifests
        run: |
          set -euo pipefail
          printf 'repo\turl\tasset\tbytes\tsha256\tcommit\tbacked_up_at\n' > manifest.tsv
          if compgen -G 'manifest-shard-*.tsv' > /dev/null; then
            tail -qn +2 manifest-shard-*.tsv >> manifest.tsv || true
          fi
          : > failed.tsv
          cat failed-shard-*.tsv >> failed.tsv 2>/dev/null || true
          printf 'merged: %s assets, %s failed\n' "$(( $(wc -l < manifest.tsv) - 1 ))" "$(wc -l < failed.tsv)"

      - name: Build report
        if: always()
        run: bash scripts/report.sh

      - name: Publish release
        if: always()
        run: |
          set -euo pipefail
          tag="$TAG"
          if [[ -s manifest.tsv ]]; then
            cp manifest.tsv "manifest-$tag.tsv"
            gh release upload "$tag" "manifest-$tag.tsv" --clobber
          fi
          if [[ -f report.md ]]; then
            gh release edit "$tag" --notes-file report.md --draft=false
          else
            gh release edit "$tag" --notes "备份流程异常中断，未生成报告。" --draft=false
          fi

      - name: Apply retention
        if: always()
        run: bash scripts/prune.sh --gfs
        env:
          SKIP_TAG: ${{ needs.prepare.outputs.tag }}
          KEEP_DAILY: '7'
          KEEP_WEEKLY: '4'
          KEEP_MONTHLY: '6'

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          if bash scripts/summary.sh && [[ -s summary.md ]]; then
            cat summary.md >> "$GITHUB_STEP_SUMMARY"
          elif [[ -f report.md ]]; then
            cat report.md >> "$GITHUB_STEP_SUMMARY"
          fi
