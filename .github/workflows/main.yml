name: Repository Backup and Release

on:
  workflow_dispatch:
    inputs:
      repo_filter:
        description: '只备份 URL 中包含该子串的仓库（留空 = 全部）'
        required: false
        default: ''
      limit:
        description: '最多处理前 N 个仓库（0 = 全部）'
        required: false
        default: '0'
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: write

concurrency:
  group: repository-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows/
            scripts/
            back_ck_url.txt
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.2
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Setup
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd pv jq
          {
            echo "WORKSPACE=$GITHUB_WORKSPACE"
            echo "START_EPOCH=$(date -u +%s)"
          } >> "$GITHUB_ENV"

      - name: Prune stale drafts
        run: bash scripts/prune.sh --drafts
        env:
          DRAFT_KEEP_DAYS: '3'

      - name: Create draft release
        id: create_release
        run: |
          set -euo pipefail
          tag="backup-$(date -u +%Y%m%d%H%M%S)"
          gh release create "$tag" \
            --title "📦 Backups $(date -u +'%Y-%m-%d %H:%M UTC')" \
            --notes "🚧 备份进行中…" \
            --draft
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Backup repositories
        run: bash scripts/backup.sh
        env:
          TAG: ${{ steps.create_release.outputs.tag }}
          LIMIT: ${{ inputs.limit }}
          REPO_FILTER: ${{ inputs.repo_filter }}

      - name: Build report
        if: always()
        run: bash scripts/report.sh
        env:
          TAG: ${{ steps.create_release.outputs.tag }}

      - name: Publish release
        if: always() && steps.create_release.outputs.tag != ''
        run: |
          set -euo pipefail
          tag="${{ steps.create_release.outputs.tag }}"
          if [[ -s manifest.tsv ]]; then
            cp manifest.tsv "manifest-$tag.tsv"
            gh release upload "$tag" "manifest-$tag.tsv" --clobber
          fi
          if [[ -f report.md ]]; then
            gh release edit "$tag" --notes-file report.md --draft=false
          else
            gh release edit "$tag" --notes "备份流程异常中断，未生成报告。" --draft=false
          fi

      - name: Apply retention
        if: always() && steps.create_release.outputs.tag != ''
        run: bash scripts/prune.sh --gfs
        env:
          SKIP_TAG: ${{ steps.create_release.outputs.tag }}
          KEEP_DAILY: '7'
          KEEP_WEEKLY: '4'
          KEEP_MONTHLY: '6'

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          if bash scripts/summary.sh && [[ -s summary.md ]]; then
            cat summary.md >> "$GITHUB_STEP_SUMMARY"
          elif [[ -f report.md ]]; then
            cat report.md >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          TAG: ${{ steps.create_release.outputs.tag }}
